<!DOCTYPE html>
<html lang = "pt-BR">
<head>
    <meta char = "UTF-8">
    <meta
        name = "viewport"
        content="width = device-width, initial-scale = 1.0">
    
    <title>OdontoGestão - Dashboard</title>
    <link rel = "stylesheet" href = "style.css">
</head>

<body>
    <div class = "dashboard-container">
        <aside class = "sidebar">
            <div class = "sidebar-logo">
                <h2>OdontoGestão</h2>
            </div>

            <nav class = "sidebar-menu">
                <a href = "#" class = "active">Dashboard</a>
                <a href = "#">Pacientes</a>
                <a href = "#">Agenda</a>
            </nav>
            <a href = "index.html" class = "logout-button">Sair</a>
        </aside>

        <main clas = "main-content">
            <header class = "topbar">
                <div>
                    <h1>Dashboard</h1>
                    <p>Visão Geral da Clínica</p>
                </div>

                <div class = "user">
                    Dr(a). Nome do Usuário
                </div>

            </header>

            <section class = "cards">
                <div class = "card">

                    <p>Consultas de hoje</p>
                    <h2>8</h2>

                </div>

                <div class = "card">

                    <p>Consultas confirmadas</p>
                    <h2>5</h2>

                </div>

                <div class = "card">

                    <p>Consultas Canceladas</p>
                    <h2>1</h2>

                </div>

                <div class = "card">

                    <p>Pacientes</p>
                    <h2>124</h2>

                </div>

            </section>
               
            <section class = "appointments">
                <div class="section-header">
                    <h2>Próximas Consultas</h2>
                    <a href = "#" > Ver agenda</a>
                </div>

                <div class = "appointment">
                    <div class = "appointment-time">
                        09:00
                    </div>                
                </div>

                <div class = "appointment-info">
                    <strong>João da Silva</strong>
                    <span>Limpeza Dental</span>
                </div>

                <div >
                    <span class = "status confirmed">
                    Confirmada   
                    </span>
                </div>

            </section>

        </main>


    </div>

</body>

</html>
