<!DOCTYPE html>
<html lang = "pt-BR">
<head>
    <meta char = "UTF-8">
    <meta
        name = "viewport"
        content="width = device-width, initial-scale = 1.0">
    
    <title>OdontoGestão - Dashboard</title>
    <link rel = "stylesheet" href = "dashboard.css">

<body>
    <div class = "dashboard-container">
        <aside class = "sidebar">
            <div class = "sidebar-logo">
                <h2>OdontoGestão</h2>
            </div>

            <nav class = "sidebar-menu">
                <a href = "#" class = "active">Dashboard</a>
                <a href = "#">Pacientes</a>
                <a href = "#">Agenda</a>
                <a href = "#">Financeiro</a>
            </nav>
            <a href = "index.html" class = "logout-button">Sair</a>
        </aside>

        <main class = "main-content">
            <header class = "topbar">
                <div>
                    <h1>Dashboard</h1>
                    <p>Visão Geral da Clínica</p>
                </div>

                <div class = "user">
                    Dr(a). Nome do Usuário
                </div>

            </header>

            <section class = "cards">
                <div class = "card">

                    <p>Consultas de hoje</p>
                    <h2>8</h2>

                </div>

                <div class = "card">

                    <p>Consultas confirmadas</p>
                    <h2>5</h2>

                </div>

                <div class = "card">

                    <p>Consultas Canceladas</p>
                    <h2>1</h2>

                </div>

                <div class = "card">

                    <p> Total de Pacientes</p>
                    <h2>124</h2>

                </div>

                <div class = "card">
                    <p>Atendimentos concluídos</p>
                    <h2>3</h2>
                </div>

            </section>

        </main>


    </div>

    <script src="dashboard.js"></script>

</body>

</html>
